# render.yaml
# Blueprint for deploying Murmur backend services on Render

services:
  # Node.js Backend Application (Web Service)
  - type: web
    name: murmur-backend # Or your preferred service name
    runtime: docker
    dockerfilePath: ./server/Dockerfile # Path from root of your repo
    dockerContext: ./server # Build context for the backend
    # dockerCommand: "" # Optional: if your Dockerfile's CMD is sufficient
    plan: free # Using free tier for web service
    envVars:
      - fromGroup: murmur-env # Name of an environment group you create in Render
      # Individual env vars can also be set here if not in a group
      # Render provides PORT automatically.
      # Connection details for Redis & RabbitMQ will come from the 'murmur-env' group.
      # For Render's managed Redis:
      #   - REDIS_HOST will be 'murmur-redis' (service discovery name).
      #   - REDIS_URL (including password) will be injected by Render.
      #   - The application (server/src/config/redis.ts) should ideally use REDIS_URL.
      # For external RabbitMQ:
      #   - Connection details (RABBITMQ_URL or individual vars) also come from murmur-env.
      # RABBITMQ_DEFAULT_USER & RABBITMQ_DEFAULT_PASS from 'murmur-env'
    autoDeploy: yes # Or no, depending on your preference
    # healthCheckPath: / # Or a specific health check endpoint in your app



  # Render Managed Redis (Key Value store)
  - type: keyvalue
    name: murmur-redis
    plan: free # Explicitly use free plan
    # region: oregon # Optional: specify a region if needed, e.g., oregon, frankfurt
    ipAllowList: [] # Allow access from other Render services in the same private network

envVarGroups:
  - name: murmur-env
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: "production" # Typically 'production' for deployed environments
      - key: CORS_WHITELIST
        generateValue: true
      - key: DATABASE_URL
        generateValue: true
      - key: DIRECT_URL
        generateValue: true
      - key: BACKEND_INTERNAL_PORT
        value: "4000" # Default from your .env.production
      - key: BACKEND_EXPOSED_HTTP_PORT
        value: "8080" # Default from your .env.production
      - key: VITE_CLIENT_FALLBACK_PORT
        value: "8080" # Default from your .env.production
      - key: RABBITMQ_DEFAULT_USER
        generateValue: true
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true
      - key: RABBITMQ_HOST
        generateValue: true # Set this to your external RabbitMQ host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_URL
        generateValue: true # Will be constructed by the app or set in dashboard
      # REDIS_HOST, REDIS_PORT, REDIS_PASSWORD for external Redis are removed.
      # For Render's managed Redis, connection is via REDIS_URL (injected by Render)
      # and service discovery (host name will be 'murmur-redis').
      - key: INCOMING_MESSAGES_QUEUE
        value: "incoming_messages"
      - key: OUTGOING_MESSAGES_QUEUE
        value: "outgoing_messages"
      - key: NOTIFICATION_MESSAGES_QUEUE
        value: "notification_messages"
      - key: MESSAGE_PROCESSOR_WORKER_COUNT
        value: "2"
      - key: MESSAGE_PROCESSOR_RETRY_DELAY
        value: "5000"
      - key: MESSAGE_PROCESSOR_MAX_RETRIES
        value: "3"
      - key: VITE_BACKEND_URL
        generateValue: true # This will be the Render URL for murmur-backend
      - key: VITE_FRONTEND_URL
        generateValue: true # This will be your frontend's URL
      - key: VITE_WEBSOCKET_URL
        generateValue: true # This will be the Render WebSocket URL for murmur-backend
