# render.yaml
# Blueprint for deploying Murmur backend services on Render

services:
  # Node.js Backend Application (Web Service)
  - type: web
    name: murmur-backend # Or your preferred service name
    env: docker
    dockerfilePath: ./server/Dockerfile # Path from root of your repo
    dockerContext: ./server # Build context for the backend
    # dockerCommand: "" # Optional: if your Dockerfile's CMD is sufficient
    plan: standard # Or your preferred plan (e.g., starter)
    envVars:
      - fromGroup: murmur-env # Name of an environment group you create in Render
      # Individual env vars can also be set here if not in a group
      # Render provides PORT automatically.
      # For service discovery, Render sets internal hostnames:
      - key: REDIS_HOST
        value: murmur-redis # This must match the name of your Redis service below
      - key: REDIS_PORT
        value: 6379
      # REDIS_PASSWORD will come from your 'murmur-env' group
      - key: RABBITMQ_HOST
        value: murmur-rabbitmq # This must match the name of your RabbitMQ service below
      - key: RABBITMQ_PORT
        value: 5672
      # RABBITMQ_DEFAULT_USER & RABBITMQ_DEFAULT_PASS from 'murmur-env'
    autoDeploy: yes # Or no, depending on your preference
    # healthCheckPath: / # Or a specific health check endpoint in your app

  # Redis Private Service
  - type: pserv
    name: murmur-redis # Name for your Redis service
    env: docker
    dockerfilePath: ./redis-config/Dockerfile # Path from root of your repo
    dockerContext: ./redis-config # Build context for Redis
    plan: standard # Or your preferred plan
    envVars:
      - fromGroup: murmur-env # To get REDIS_PASSWORD
      # Or set REDIS_PASSWORD directly if not using a group:
      # - key: REDIS_PASSWORD
      #   value: your_actual_redis_password
    disks:
      - name: redis-data
        mountPath: /data
        sizeGB: 1 # Or your preferred size
    autoDeploy: yes

  # RabbitMQ Private Service
  - type: pserv
    name: murmur-rabbitmq # Name for your RabbitMQ service
    env: docker # Using a pre-built Docker image
    dockerImageName: rabbitmq:3.12-management-alpine
    plan: standard # Or your preferred plan
    envVars:
      - fromGroup: murmur-env # To get RABBITMQ_DEFAULT_USER & RABBITMQ_DEFAULT_PASS
      # Or set them directly:
      # - key: RABBITMQ_DEFAULT_USER
      #   value: your_rabbitmq_user
      # - key: RABBITMQ_DEFAULT_PASS
      #   value: your_rabbitmq_password
    disks:
      - name: rabbitmq-data
        mountPath: /var/lib/rabbitmq
        sizeGB: 1 # Or your preferred size
    autoDeploy: yes

envVarGroups:
  - name: murmur-env # You will create this group in the Render dashboard
    envVars:
      - key: JWT_SECRET
      - key: NODE_ENV
      - key: CORS_WHITELIST # For production, set to your VITE_FRONTEND_URL
      - key: DATABASE_URL
      - key: DIRECT_URL
      - key: BACKEND_INTERNAL_PORT # Primarily for local Docker
      - key: BACKEND_EXPOSED_HTTP_PORT # Primarily for local Docker
      - key: VITE_CLIENT_FALLBACK_PORT # Primarily for local client dev
      - key: RABBITMQ_DEFAULT_USER
      - key: RABBITMQ_DEFAULT_PASS
      - key: RABBITMQ_HOST # Will be overridden by service discovery for backend service
      - key: RABBITMQ_PORT # Standard 5672
      - key: RABBITMQ_URL # Ensure your app can construct this from individual parts if needed
      - key: REDIS_HOST # Will be overridden by service discovery for backend service
      - key: REDIS_PORT # Standard 6379
      - key: INCOMING_MESSAGES_QUEUE
      - key: OUTGOING_MESSAGES_QUEUE
      - key: NOTIFICATION_MESSAGES_QUEUE
      - key: MESSAGE_PROCESSOR_WORKER_COUNT
      - key: MESSAGE_PROCESSOR_RETRY_DELAY
      - key: MESSAGE_PROCESSOR_MAX_RETRIES
      - key: VITE_BACKEND_URL # This will be the URL Render assigns to murmur-backend
      - key: VITE_FRONTEND_URL
      # Note: Actual values (especially secrets) should be set in the Render dashboard
      # for the 'murmur-env' group, not in this YAML file for security.
